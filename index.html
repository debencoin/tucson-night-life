<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tucson Night Life App</title>
<meta name="theme-color" content="#0a0710">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Night Life">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one phone-width column. Black room, magenta-to-violet club light for actions, gold only where money or VIP is involved. */
  --ink:#0a0710; --panel:#150f1d; --raise:#20172b; --line:#35293f;
  --text:#f7f0fb; --dim:#ab9bbb;
  --hot:#ff2d7a; --violet:#a63dff; --gold:#ffc24d;
  --ok:#3ddc97; --warn:#ffb020; --crit:#ff5c5c;
  --neon:linear-gradient(100deg,#ff2d7a,#a63dff);
  --sunset:linear-gradient(100deg,#ff2d7a,#ff8a3d 60%,#ffc24d);
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050308;color:var(--text);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[data-a]{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);overflow:hidden;overflow:clip;box-shadow:0 0 0 1px #1c1426,0 0 120px #a63dff22}
.app.wide{max-width:980px}
.app:before{content:"";position:absolute;inset:-60px 0 auto 0;height:340px;background:radial-gradient(closest-side,#ff2d7a2e,transparent),radial-gradient(closest-side at 80% 30%,#a63dff33,transparent);pointer-events:none}
header{position:relative;padding:14px 16px 8px;z-index:2}
.bar{display:flex;align-items:center;gap:8px}
.logo{font:800 14px/1 var(--display);letter-spacing:.02em;display:flex;flex-direction:column;gap:3px}
.logo b{background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font:600 9px/1 var(--body);letter-spacing:.3em;color:var(--dim)}
.sp{flex:1}
.pts{font:700 12px var(--body);padding:7px 10px;border-radius:99px;background:#ffc24d1c;color:var(--gold);border:1px solid #ffc24d44;font-variant-numeric:tabular-nums}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;background:var(--raise);display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn i{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--hot);font:700 10px/17px var(--body);font-style:normal;text-align:center;padding:0 4px}
.acct{font:700 11px var(--body);padding:8px 10px;border-radius:99px;background:var(--raise);border:1px solid var(--line);color:var(--gold);white-space:nowrap}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 26px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*,.pane>*{flex:0 0 auto}
nav{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0d0914;border-top:1px solid var(--line);padding:6px 6px 10px}
nav:empty{display:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:600 10px var(--body);color:var(--dim);border-radius:10px}
nav button.on{color:var(--hot)}
nav button.ctr span.orb{width:46px;height:46px;margin-top:-22px;border-radius:50%;background:var(--neon);display:grid;place-items:center;color:#fff;box-shadow:0 6px 22px #ff2d7a66;border:3px solid #0d0914}
h1{font:800 25px/1.08 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 14px/1.2 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font:700 16px/1.25 var(--body);margin:0}
.eyebrow{font:700 10px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--hot)}
.dim{color:var(--dim)} .gold{color:var(--gold)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px} .g6{gap:6px}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.card.vip{border-color:#ffc24d66;background:linear-gradient(160deg,#2a1f0d,#150f1d 60%)}
.card.good{border-color:var(--ok)} .card.bad{border-color:var(--crit)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:13px;background:var(--neon);color:#fff;font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.goldb{background:linear-gradient(100deg,#ffd778,#e9a020);color:#1a1204}
.btn.sm{padding:9px 12px;font-size:11.5px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label.btn{position:relative}
label.btn:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font:600 12px var(--body);color:var(--dim)}
.chip.on{background:var(--neon);border-color:transparent;color:#fff}
.tag{display:inline-block;padding:4px 8px;border-radius:7px;background:var(--raise);font:600 10.5px var(--body);color:var(--dim);white-space:nowrap}
.tag.live{background:var(--crit);color:#fff;letter-spacing:.08em}
.tag.gold{background:#ffc24d22;color:var(--gold)}
.tag.ok{background:#3ddc9722;color:var(--ok)} .tag.warn{background:#ffb02022;color:var(--warn)} .tag.crit{background:#ff5c5c22;color:var(--crit)}
.art{position:relative;height:128px;border-radius:14px;overflow:hidden;background:#120b1a}
.art:before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 90% at 20% 0,hsl(var(--h) 95% 58%/.85),transparent 60%),
  radial-gradient(50% 80% at 85% 10%,hsl(calc(var(--h) + 55) 95% 55%/.7),transparent 60%),
  repeating-conic-gradient(from 200deg at 50% -10%,#fff0 0 7deg,#ffffff14 7deg 9deg)}
.art:after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:radial-gradient(circle,#000 1.2px,transparent 1.6px) 0 0/9px 9px,linear-gradient(transparent,#0a0710);opacity:.85}
.art .over{position:absolute;z-index:1;inset:auto 10px 10px 10px;display:flex;gap:6px;flex-wrap:wrap}
.art.tall{height:160px}
.meter{height:8px;border-radius:9px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--neon)}
.meter.goldm i{background:linear-gradient(90deg,#e9a020,#ffd778)}
.flyers{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.flyer{flex:0 0 190px;display:flex;flex-direction:column;gap:8px;text-align:left}
.flyer img,.flyer .art{width:100%;height:240px;object-fit:cover;object-position:top;border-radius:14px;border:1px solid var(--line)}
.map{position:relative;border-radius:16px;border:1px solid var(--line);background:#120d19;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--neon);border:2px solid #fff;font:700 10px/26px var(--body);text-align:center;color:#fff;box-shadow:0 0 0 6px #ff2d7a33}
.pin.hotp{box-shadow:0 0 0 6px #ff2d7a55,0 0 0 13px #ff2d7a22}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);color:#fff;background:hsl(var(--h) 70% 42%);border:2px solid var(--ink)}
.av.lg{width:72px;height:72px;font-size:24px}
.avs{display:flex}.avs .av{margin-left:-9px}.avs .av:first-child{margin-left:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font:800 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--dim)}
.big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.kv:last-child{border-bottom:0}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:120px;padding-top:16px}
.bars div{position:relative;border-radius:6px 6px 2px 2px;background:var(--neon);min-height:2px}
.bars div b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:600 10px var(--body);color:var(--dim);white-space:nowrap}
.barlabels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;text-align:center;font-size:10.5px;color:var(--dim)}
.hb{display:grid;grid-template-columns:64px 1fr 70px;align-items:center;gap:10px;font-size:13px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--hot)}
textarea{resize:none;min-height:72px}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:#ff2d7a}
.step{display:flex;align-items:center;gap:12px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--neon);font:700 18px/1 var(--body)}
.sw{position:relative;width:44px;height:26px;border-radius:14px;background:var(--raise);border:1px solid var(--line);flex:0 0 auto}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.15s}
.sw.on{background:var(--hot);border-color:transparent}.sw.on:after{left:20px;background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;font-size:12.5px;line-height:1.25}
.ph{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:linear-gradient(150deg,#2b1a3a,#150f1d);display:grid;place-items:center;overflow:hidden;color:var(--gold)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg.ic{width:34px;height:34px}
.ph.sm{width:46px;flex:0 0 46px;border-radius:10px}.ph.sm svg.ic{width:22px;height:22px}
.item .q{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--hot);font:700 12px/22px var(--body);text-align:center;padding:0 5px}
.item b{font-variant-numeric:tabular-nums;color:var(--gold)}
.sheet{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;background:#000a}
.sheet.open{display:flex}
.sheet .pane{width:100%;max-height:93%;overflow-y:auto;background:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px 22px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.close{align-self:flex-end;width:34px;height:34px;border-radius:50%;background:var(--raise);font-size:18px;line-height:1;margin-bottom:-6px}
.ticket{background:linear-gradient(160deg,#ff2d7a,#a63dff);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.ticket:before,.ticket:after{content:"";position:absolute;top:58%;width:22px;height:22px;border-radius:50%;background:var(--ink)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.stamp{border:2px solid #8dffb5;color:#8dffb5;font:700 11px var(--body);letter-spacing:.1em;padding:4px 8px;border-radius:5px;white-space:nowrap}
.stamp.used{border-color:#fff8;color:#fffc}
.qr{background:#fff;border-radius:12px;padding:10px;align-self:center;line-height:0}
.qr svg{display:block;width:176px;height:176px}
.pass{border-radius:20px;padding:16px;background:linear-gradient(140deg,#241a0a,#0f0a14 55%,#2a0f24);border:1px solid #ffc24d77;display:flex;gap:14px;align-items:center}
.pass .qr svg,.qr.s svg{width:104px;height:104px}
.lock{position:relative}
.lock .veil{position:absolute;inset:0;border-radius:18px;background:linear-gradient(#0a071000,#0a0710 60%);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.blur{filter:blur(5px);pointer-events:none;user-select:none}
#push{position:absolute;z-index:30;top:8px;left:10px;right:10px;background:#231a2ef2;border:1px solid var(--line);border-radius:16px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;transform:translateY(-140%);transition:transform .3s;box-shadow:0 14px 40px #000a;text-align:left}
#push.show{transform:none}
#push .dot{flex:0 0 30px;height:30px;border-radius:8px;background:var(--sunset);display:grid;place-items:center;font:800 9px var(--display);color:#1a0b10}
#toast{position:absolute;z-index:31;left:50%;bottom:86px;transform:translateX(-50%);background:#fff;color:#12091a;font:600 13px var(--body);padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.note{font-size:11.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
a{color:var(--gold)}
.perkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.perk{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}.perk b{font:700 11.5px/1.2 var(--body)}.perk span{font-size:10.5px;line-height:1.3;color:var(--dim)}
button.badge{cursor:pointer}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.9);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px}.seg2 button{padding:9px 4px;border-radius:9px;font:600 12px var(--body);color:var(--dim)}.seg2 button.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.av{overflow:hidden;position:relative}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tcard{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 18px 40px #0009;user-select:none;-webkit-user-select:none}
.tcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.segs{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}.segs i{flex:1;height:3px;border-radius:2px;background:#ffffff55}.segs i.on{background:#fff}
.tnav{position:absolute;top:0;bottom:40%;width:50%;z-index:2}.tnav.l{left:0}.tnav.r{right:0}
.tinfo{position:absolute;left:0;right:0;bottom:0;padding:80px 16px 16px;background:linear-gradient(transparent,#000000eb 45%);display:flex;flex-direction:column;gap:7px;z-index:1}
.tname{font:800 26px/1.05 var(--display);letter-spacing:-.02em}.tname span{font:500 22px var(--body);margin-left:8px}
.deck{position:relative}.deck .tcard.next{position:absolute;inset:0;transform:scale(.94) translateY(14px);opacity:.5}
.deck #swipeCard{position:relative;z-index:1;touch-action:pan-y;cursor:grab}
.stamp2{position:absolute;top:34px;z-index:3;padding:4px 12px;border:4px solid;border-radius:10px;font:800 24px var(--display);opacity:0;pointer-events:none}
.st-like{left:18px;color:#3ddc97;transform:rotate(-14deg)}.st-nope{right:18px;color:#ff5c7a;transform:rotate(14deg)}
.rbs{display:flex;justify-content:center;align-items:center;gap:12px}
.rb{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px #0008}
.rb svg.ic{width:28px;height:28px;stroke-width:2.4}.rb.sm{width:46px;height:46px}.rb.sm svg.ic{width:21px;height:21px}
.rb.pass{color:#ff5c7a}.rb.like{color:#3ddc97}.rb.drink{color:var(--gold)}.rb.info{color:#7cc4ff}.rb.msg{color:#ff6fb5}.rb[disabled]{opacity:.4}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font:600 10.5px/1.2 var(--body)}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--raise);box-shadow:inset 0 0 0 2px #ffffff40,0 6px 16px #0007}
.medal svg.ic{width:22px;height:22px;stroke-width:2}
.badge.locked{color:var(--dim)}.badge.locked .medal{color:#6c5a7c;box-shadow:inset 0 0 0 1px var(--line)}
.mini-b{display:flex;gap:5px;flex-wrap:wrap}.mini-b .medal{width:26px;height:26px;box-shadow:inset 0 0 0 1px #ffffff50}.mini-b .medal svg.ic{width:14px;height:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border-radius:14px;border:1.5px dashed var(--line);background:var(--raise);display:grid;place-items:center;overflow:hidden;color:var(--dim);font:600 12px var(--body);text-align:center;cursor:pointer}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#000b;color:#fff;font-size:16px;line-height:28px;z-index:1}
.slot input{position:absolute;width:1px;height:1px;opacity:0}.slot:focus-within{outline:2px solid var(--gold)}
.here{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.here .hp{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--body);text-align:center}
.here .av{width:60px;height:60px}
.bubs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 12px;border-radius:18px;font-size:14px;line-height:1.35}
.bub.me{align-self:flex-end;background:var(--neon);border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--raise);border-bottom-left-radius:5px}
.bub.gift{align-self:flex-end;background:linear-gradient(100deg,#ffd778,#e9a020);color:#1a1204;border-bottom-right-radius:5px}
.match{display:flex;justify-content:center;margin:8px 0}.match .av{width:110px;height:110px;border:4px solid var(--ink)}.match .av+.av{margin-left:-20px}
details.card summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:3px}details.card summary::-webkit-details-marker{display:none}
details.card summary b:after{content:" +";color:var(--hot)}details.card[open] summary b:after{content:" −"}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;font-size:14px}
ol.steps li:before{content:counter(st);flex:0 0 22px;height:22px;border-radius:50%;background:var(--neon);font:700 12px/22px var(--body);text-align:center}
.osh{display:inline-block;vertical-align:-3px;width:16px;height:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <button id="push" data-a="openNotifs" aria-live="polite"><span class="dot">TNL</span><span><b id="pushT"></b><br><span class="small dim" id="pushB"></span></span></button>

const nextTier=()=>S.life>=10000?null:S.life>=2500?{n:'Black',at:10000,from:2500}:{n:'Gold',at:2500,from:0};
const methods=()=>Object.keys(PAYN).filter(k=>S.payc[k].on);
const taxOf=sub=>sub<=0?0:Math.round((S.tax.mode==='pct'?sub*S.tax.val/100:+S.tax.val)*100)/100;
const taxLbl=()=>S.tax.mode==='pct'?`Sales tax (${S.tax.val}%)`:'Sales tax (flat)';

/* ---------- money: one function feeds every report, payout and preview ---------- */
function rev(ev){const r=Object.assign({},ev.base);S.sales.forEach(s=>{if(s.ev===ev.id)r[s.cat]+=s.amt});return r}
function calc(ev,sp){sp=sp||S.split;const r=rev(ev),gross=r.door+r.bar+r.tables+r.hookah,fee=gross*S.pf.tx/100,k=1-S.pf.tx/100;
  const promo=k*(r.door*sp.door+r.bar*sp.bar+r.tables*sp.tables+r.hookah*sp.hookah)/100,venue=gross-fee-promo;
  const share=(who,cost,payer)=>ev.status==='upcoming'?0:payer==='split'?cost/2:payer===who?+cost:0;
  const pc=share('promoter',sp.djCost,sp.dj)+share('promoter',sp.secCost,sp.sec)+share('promoter',sp.hostCost,sp.host),vc=share('venue',sp.djCost,sp.dj)+share('venue',sp.secCost,sp.sec)+share('venue',sp.hostCost,sp.host);
  const tax=S.sales.reduce((a,s)=>a+(s.ev===ev.id?s.tax||0:0),0);
  return {r,gross,fee,promo,venue,pc,vc,tax,promoNet:promo-pc,venueNet:venue-vc}}
function recordSales(ev,list,tax){list.forEach((s,i)=>S.sales.push({ev,cat:s.cat,amt:s.amt,tax:i?0:tax||0}))}
function cartOf(c,custom,menu){menu=menu||S.menu;const lines=[],by={};let sub=0;Object.keys(c).forEach(id=>{const it=menu.find(m=>m.id===id);if(!it||!c[id])return;const a=it.price*c[id];lines.push([c[id]+' × '+it.name,a]);by[it.cat]=(by[it.cat]||0)+a;sub+=a});
  if(custom>0){lines.push(['Custom amount',custom]);by.bar=(by.bar||0)+custom;sub+=custom}
  const tax=taxOf(sub);return {lines,sub,tax,total:sub+tax,sales:Object.keys(by).map(k=>({cat:k,amt:by[k]}))}}

  if(mode!=='sec')S.giftsOut.concat(S.giftsIn).forEach(g=>{if(g.status==='paid')wait.push(['Gift · '+g.lines.map(l=>l[0]).join(', '),'For '+g.to+' from '+g.from,'TNL:G:'+g.id,'Validate'])});
  if(mode!=='sec')S.orders.forEach(o=>{if(o.status!=='served')wait.push([`Order ${o.id} · ${usd(o.total)}`+(o.table?' · table '+o.table:o.loc||o.locStopped?' · find guest':''),o.lines.map(l=>l[0]).join(', '),'TNL:O:'+o.id,o.table||o.loc||o.locStopped?'Deliver':'Validate'])});
  S.tickets.forEach((t,i)=>{if(!t.used)wait.push([`Ticket · ${E(t.ev).name}`,t.qty+(t.qty>1?' guests':' guest'),'TNL:T:'+i,'Admit'])});

   <button class="btn full" data-a="sale">Record sale and give points</button><div class="row"><button class="btn ghost sm grow" data-a="doorIn">Check in at door · +50 pts</button><button class="btn ghost sm" data-a="scanDone">Done</button></div></div>`:''}

/* ---------- scanning ---------- */
function handleCode(text,who){const m=/^TNL:([MOTVCGF]):(.+)$/.exec(String(text).trim());
  if(who==='member'){if(m&&m[1]==='C'){const c=S.charges.find(x=>x.id===m[2]);if(c&&c.status==='open')return A.payCharge(c.id);return toast(c?'That tab is already paid':'That code is not an open bar tab')}return toast('That is not a bar payment code')}
  const set=(ok,t,b)=>{S.lastScan={ok,t,b}};
  if(!m)return set(0,'Code not recognized','This is not a Tucson Night Life code. Ask the guest to open their pass in the app.');
  const id=m[2];
  if(m[1]==='M'){S.scanMember=true;return set(1,me()+' · member 00417',`${tier()} tier. Their details are below.`)}
  if(m[1]==='O'){const o=S.orders.find(x=>x.id===id);if(!o)return set(0,'Order not found','No paid order matches this code.');if(o.status==='served')return set(0,o.table||o.loc||o.locStopped?'Already delivered':'Already picked up','Order '+o.id+' was handed over earlier. Do not serve it twice.');const del=!!(o.table||o.loc||o.locStopped);o.status='served';o.scanned=Date.now();if(o.loc){o.loc=null;o.locStopped=true}if(sheetFn==='findGuest'&&sheetArg.v===o.id)closeSheet();notify('deals',del?'Order '+o.id+' delivered':'Order '+o.id+' picked up',del?'Your server scanned your code. '+(o.locStopped?'Location sharing has ended. ':'')+'Enjoy.':'Enjoy. Your points are already in your balance.');toast('Order '+o.id+' confirmed by scan');return set(1,(del?'Delivered · order ':'Paid · order ')+o.id,o.lines.map(l=>l[0]).join(', ')+(del?'. Delivery confirmed.':'. Hand it over.'))}
  if(m[1]==='T'){const t=S.tickets[+id];if(!t)return set(0,'Ticket not found','No ticket matches this code.');if(t.used)return set(0,'Ticket already used','This ticket was scanned in earlier tonight.');if(t.split&&t.split.shares.some(x=>!x.paid))return set(0,'Group has not finished paying',t.split.shares.filter(x=>x.paid).length+' of '+t.split.shares.length+' have paid for this table.');t.used=true;markEntered();S.points+=50;S.life+=50;S.scans.unshift({what:'Door check-in',amt:0,pts:50});return set(1,'Paid · admit '+t.qty,E(t.ev).name+(t.table?' with a table':'')+'. Guest earned 50 points.')}
  if(m[1]==='F'){const v=S.fdV.find(x=>x.id===id);if(!v)return set(0,'Free drink not found','No free drink matches this code.');if(v.st!=='ready')return set(0,'Already served','This free drink was served earlier. Do not serve it twice.');v.st='served';fdLog(v.for,v.item==='Free drink'?'Free drink':v.item,'served');return set(1,'Free drink · for '+v.for,(v.choice?'Any of: '+v.choice:v.item)+(v.from?'. Sent by '+v.from:'')+'. Member perk, no charge.')}
  if(m[1]==='G'){const g=S.giftsOut.concat(S.giftsIn).find(x=>x.id===id);if(!g)return set(0,'Drink not found','No paid drink matches this code.');if(g.status!=='paid')return set(0,'Already served','This drink was served earlier. Do not serve it twice.');g.status='served';if(g.to===me())notify('deals','Your drink from '+g.from+' is on the way','Say thanks in Messages.');return set(1,'Paid gift · for '+g.to,g.lines.map(l=>l[0]).join(', ')+' from '+g.from+'. Hand it over.')}
  if(m[1]==='V'){const v=S.vouchers[+id];if(!v)return set(0,'Reward not found','No reward matches this code.');if(v.used)return set(0,'Reward already used','This reward was honored earlier.');v.used=true;return set(1,'Reward · '+v.name,'Honor it at '+v.where+'.')}
  set(0,'Guest payment code','That code is for the guest to scan, not staff.')}
function readImg(file,f){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const scan=f.indexOf('scan')===0,mx=scan?1200:560,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*k|0);c.height=Math.max(1,im.height*k|0);
   const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
   if(scan){let r=null;try{r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height)}catch(e){}
     if(r&&r.data)handleCode(r.data,f==='scan-member'?'member':'staff');else if(typeof jsQR==='undefined')toast('The scanner did not load. Check your connection and reopen the app');else toast('No code found. Fill the frame with the code and try again')}
   else if(f.indexOf('photo')===0){const W=480,H=600,cv=document.createElement('canvas');cv.width=W;cv.height=H;const k2=Math.max(W/im.width,H/im.height),w=im.width*k2,hh=im.height*k2;cv.getContext('2d').drawImage(im,(W-w)/2,(H-hh)/2,w,hh);S.photos[+f.slice(5)]=cv.toDataURL('image/jpeg',.8);S.photos=S.photos.filter(Boolean).slice(0,3);toast('Photo added to your profile')}else if(f==='doc'){S.form.vfDoc=1}else{const url=c.toDataURL('image/jpeg',.72);if(f==='ev')S.form.evImg=url;else if(f==='item')S.form.itImg=url;else{const it=S.menu.find(m=>m.id===f);if(it)it.img=url}}
   render()};im.onerror=()=>toast('That file is not a photo');im.src=fr.result};fr.readAsDataURL(file)}
